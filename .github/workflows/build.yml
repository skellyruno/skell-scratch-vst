name: Build ScratchPad Windows VST3
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Source/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'README.md'
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: scratchpad-\${{ github.workflow }}-\${{ github.ref }}
  # Supersede only PR validation; preserve main pushes and manual builds.
  cancel-in-progress: \${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SOURCE_COMMIT: \${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6

      - name: Test strict VST3 moduleinfo normalizer
        run: python tests/test_vst3_moduleinfo.py

      - name: Configure Windows x64
        run: cmake -S . -B build -A x64

      - name: Build Release VST3 and regression executables
        run: cmake --build build --config Release --parallel 2

      - name: Run DSP and real JUCE processor/editor tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate editor geometry at supported sizes
        run: python tests/ui_geometry_check.py

      - name: Stage and verify one Windows VST3 bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundles = @(Get-ChildItem -Path build -Directory -Recurse -Filter 'ScratchPad.vst3' | Where-Object { $_.FullName -match '[\\/]Release[\\/]' })
          if ($bundles.Count -ne 1) { throw "Expected exactly one Release ScratchPad.vst3 bundle; found $($bundles.Count)" }
          $plugin = $bundles[0]
          $moduleDir = Join-Path $plugin.FullName 'Contents/x86_64-win'
          $binary = Join-Path $moduleDir 'ScratchPad.vst3'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw "Windows VST3 module missing: $binary" }
          $modules = @(Get-ChildItem -LiteralPath $moduleDir -File -Filter '*.vst3')
          if ($modules.Count -ne 1 -or $modules[0].Name -ne 'ScratchPad.vst3') { throw "Expected exactly one x64 VST3 module; found $($modules.Count)" }

          $bytes = [System.IO.File]::ReadAllBytes($binary)
          if ($bytes.Length -lt 512 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Invalid Windows PE DOS signature' }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -lt 0x40 -or ($peOffset + 26) -gt $bytes.Length -or
              [Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4) -ne ("PE" + [char]0 + [char]0)) {
            throw 'Invalid Windows PE signature or offset'
          }
          if ([BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) { throw 'VST3 module is not AMD64' }
          if ([BitConverter]::ToUInt16($bytes, $peOffset + 24) -ne 0x20B) { throw 'VST3 module is not PE32+' }

          $standalone = @(Get-ChildItem -Path build -Recurse -File -Filter 'ScratchPad.exe')
          if ($standalone.Count -ne 0) { throw 'Unexpected ScratchPad Standalone executable in VST3-only build' }

          $previews = Join-Path $PWD 'build/ui-previews'
          foreach ($name in @('scratchpad-441x263.png','scratchpad-882x526.png','scratchpad-1323x789.png')) {
            if (-not (Test-Path -LiteralPath (Join-Path $previews $name) -PathType Leaf)) { throw "Required actual JUCE editor preview missing: $name" }
          }

          $stage = Join-Path $PWD 'release-package'
          if (Test-Path -LiteralPath $stage) { throw 'Refusing to overwrite an existing release-package directory' }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -LiteralPath $plugin.FullName -Destination (Join-Path $stage 'ScratchPad.vst3') -Recurse
          $previewStage = Join-Path $stage 'ui-previews'
          New-Item -ItemType Directory -Path $previewStage | Out-Null
          Copy-Item -Path (Join-Path $previews '*.png') -Destination $previewStage -Force

          $stagedBinary = Join-Path $stage 'ScratchPad.vst3/Contents/x86_64-win/ScratchPad.vst3'
          $stagedInfo = Join-Path $stage 'ScratchPad.vst3/Contents/Resources/moduleinfo.json'
          if (-not (Test-Path -LiteralPath $stagedInfo -PathType Leaf)) { throw 'VST3 moduleinfo.json is required' }
          $binaryHash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-FileHash -LiteralPath $stagedBinary -Algorithm SHA256).Hash.ToLowerInvariant() -ne $binaryHash) { throw 'Staged VST3 binary hash mismatch' }

          python scripts/normalize_vst3_moduleinfo.py $stagedInfo --report-path (Join-Path $stage 'moduleinfo-verification.json')
          if ($LASTEXITCODE -ne 0) { throw 'Strict VST3 moduleinfo normalization/identity verification failed' }
          $metadata = Get-Content -LiteralPath $stagedInfo -Raw | ConvertFrom-Json -ErrorAction Stop
          if ($metadata.Name -ne 'ScratchPad' -or $metadata.Version -ne '1.19.0') { throw 'Unexpected ScratchPad VST3 name/version' }
          if ($metadata.'Factory Info'.Vendor -ne 'Skell Audio') { throw 'Unexpected ScratchPad VST3 vendor' }
          Write-Host "Verified ScratchPad 1.19.0 Windows VST3; binary SHA256: $binaryHash"

      - name: Validate exact staged VST3 with pluginval
        uses: Tracktion/pluginval/validate@v2.0.0-beta3
        with:
          plugins: release-package/ScratchPad.vst3
          strictness-level: 5
          pluginval-version: v2.0.0-beta3

      - name: Write preview provenance and complete checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $PWD 'release-package'
          $bundle = Join-Path $stage 'ScratchPad.vst3'
          $binary = Join-Path $bundle 'Contents/x86_64-win/ScratchPad.vst3'
          $info = Join-Path $bundle 'Contents/Resources/moduleinfo.json'
          $metadata = Get-Content -LiteralPath $info -Raw | ConvertFrom-Json -ErrorAction Stop
          $verification = Get-Content -LiteralPath (Join-Path $stage 'moduleinfo-verification.json') -Raw | ConvertFrom-Json -ErrorAction Stop
          $binaryHash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          $metadataHash = (Get-FileHash -LiteralPath $info -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            schema_version = 1
            product = 'ScratchPad'
            version = [string]$metadata.Version
            vendor = 'Skell Audio'
            format = 'VST3'
            platform = 'windows-x64'
            source_commit = $env:SOURCE_COMMIT
            ci_checkout_commit = $env:GITHUB_SHA
            workflow_run_id = $env:GITHUB_RUN_ID
            windows_release_build = 'passed'
            ctest = 'passed'
            ui_geometry = 'passed'
            pluginval = @{ version = 'v2.0.0-beta3'; strictness_level = 5; result = 'passed'; target = 'release-package/ScratchPad.vst3' }
            moduleinfo = @{ strict_json = $true; original_sha256 = $verification.original_sha256; normalized_sha256 = $verification.normalized_sha256; changed = $verification.changed; class_ids = $verification.class_ids }
            binary_sha256 = $binaryHash
            package_status = 'PREVIEW_ONLY'
            release_blockers = @(
              'FL Studio scan/load, audio playback, automation and save/reopen are not yet owner-accepted',
              'Real music A/B and target-Windows CPU/latency acceptance are pending',
              'Factory metadata URL and E-Mail are blank and require owner-supplied support contacts',
              'Third-party licensing/attribution and commercial distribution approval remain pending',
              'No signed installer or manually verified install/update/rollback workflow is included'
            )
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $stage 'build-info.json') -Encoding utf8
          @'
          PREVIEW ONLY — NOT A COMMERCIAL RELEASE

          This artifact is a private Windows x64 VST3 engineering preview.
          Do not redistribute or install over a known-good production version.
          FL Studio host acceptance, real-audio A/B, target-hardware CPU/latency,
          licensing/attribution, support contacts, and signed install/update/rollback
          verification are still outstanding.
          '@ | Set-Content -LiteralPath (Join-Path $stage 'PREVIEW_ONLY.txt') -Encoding utf8

          $lines = @()
          foreach ($file in @(Get-ChildItem -LiteralPath $stage -File -Recurse | Sort-Object FullName)) {
            $relative = $file.FullName.Substring($stage.Length + 1).Replace('\','/')
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$hash  $relative"
          }
          if ($lines.Count -lt 4) { throw 'Expected bundle, provenance, preview and checksum inputs before upload' }
          $lines | Set-Content -LiteralPath (Join-Path $stage 'SHA256SUMS.txt') -Encoding ascii
          Write-Host "Wrote $($lines.Count) SHA256 entries; artifact remains PREVIEW_ONLY."

      - uses: actions/upload-artifact@v6
        with:
          retention-days: 14
          name: ScratchPad-Windows-1.19-VST3-PR-\${{ github.run_id }}
          path: release-package/
          if-no-files-found: error
