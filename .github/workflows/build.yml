name: Build ScratchPad Windows
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem build -Filter 'ScratchPad.vst3' -Recurse | Where-Object {$_.PSIsContainer} | Select-Object -First 1
          if (-not $plugin) { throw 'ScratchPad.vst3 missing' }
          Compress-Archive -Path $plugin.FullName -DestinationPath ScratchPad-Windows-VST3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ScratchPad-Windows-VST3
          path: ScratchPad-Windows-VST3.zip
