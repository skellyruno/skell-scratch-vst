name: Build ScratchPad Windows
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Run DSP regression tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage release binaries
        shell: pwsh
        run: |
          $plugin = Get-ChildItem build -Filter 'ScratchPad.vst3' -Directory -Recurse | Select-Object -First 1
          if (-not $plugin) { throw 'ScratchPad.vst3 missing' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath $plugin.FullName -Destination 'dist/ScratchPad.vst3' -Recurse -Force
          $standalone = Get-ChildItem build -Filter 'ScratchPad.exe' -File -Recurse | Where-Object { $_.FullName -match 'Standalone' } | Select-Object -First 1
          if (-not $standalone) { throw 'ScratchPad Standalone.exe missing' }
          New-Item -ItemType Directory -Path 'dist/Standalone' -Force | Out-Null
          Copy-Item -LiteralPath $standalone.FullName -Destination 'dist/Standalone/ScratchPad.exe' -Force
      # Actions downloads are already ZIP archives; no nested ZIPs.
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: ScratchPad-Windows-1.13
          path: dist/
          if-no-files-found: error
