name: Build ScratchPad Windows
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Source/SkellCore/GuidedTour.h'
      - 'Source/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
  push:
    branches: [main, master]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Run full DSP and actual JUCE editor regression tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate editor geometry at supported sizes
        run: python tests/ui_geometry_check.py
      - name: Stage release binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $plugins = @(Get-ChildItem build -Filter 'ScratchPad.vst3' -Directory -Recurse | Where-Object { $_.FullName -match '[\\/]Release[\\/]' })
          if ($plugins.Count -ne 1) { throw "Expected one Release ScratchPad.vst3 bundle, found $($plugins.Count)" }
          $plugin = $plugins[0]
          $modules = @(Get-ChildItem -LiteralPath $plugin.FullName -Filter 'ScratchPad.vst3' -File -Recurse | Where-Object { $_.FullName -match '[\\/]Contents[\\/]x86_64-win[\\/]' })
          if ($modules.Count -ne 1) { throw "Expected one x86_64-win VST3 module, found $($modules.Count)" }
          $bytes = [System.IO.File]::ReadAllBytes($modules[0].FullName)
          if ($bytes.Length -lt 512 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Invalid Windows MZ executable header' }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 64 -or $peOffset + 26 -gt $bytes.Length) { throw 'Invalid PE header offset' }
          if ([Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4) -ne "PE`0`0") { throw 'Missing PE signature' }
          if ([BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) { throw 'VST3 module is not AMD64' }
          if ([BitConverter]::ToUInt16($bytes, $peOffset + 24) -ne 0x20b) { throw 'VST3 module is not PE32+' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath $plugin.FullName -Destination 'dist/ScratchPad.vst3' -Recurse -Force
          Get-FileHash -Algorithm SHA256 -LiteralPath $modules[0].FullName | Format-List
          $installedModule = 'dist/ScratchPad.vst3/Contents/x86_64-win/ScratchPad.vst3'
          if (-not (Test-Path -LiteralPath $installedModule)) { throw 'Staged module missing' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $installedModule).Hash -ne (Get-FileHash -Algorithm SHA256 -LiteralPath $modules[0].FullName).Hash) { throw 'Staged module checksum mismatch' }
          $previews = 'build/ui-previews'
          if (-not (Test-Path "$previews/scratchpad-441x263.png")) { throw 'Actual editor preview missing' }
          New-Item -ItemType Directory -Path dist/ui-previews -Force | Out-Null
          Copy-Item -Path "$previews/*.png" -Destination dist/ui-previews -Force
      # Actions downloads are already ZIP archives; no nested ZIPs.
      - uses: actions/upload-artifact@v6
        with:
          retention-days: 7
          name: ScratchPad-Windows-1.19-VST3-PR-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
